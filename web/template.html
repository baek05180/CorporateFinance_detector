<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__SITE_NAME__ · 자본시장 조달 공시</title>
<meta name="description" content="메자닌(CB·BW·EB), 유상증자, 회사채(공모·사모·P-CBO) 조달 내역과 기업 정보, 조달 제안 보고서">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#16181d; --ink-2:#4b5059; --ink-3:#8a8f98;
  --line:#e6e3dd; --line-2:#f0eee9; --accent:#1f4fd8; --accent-soft:#e8eefc;
  --new:#d9480f; --new-soft:#fff1e8; --pub:#0f766e; --pub-soft:#e6f4f1; --pvt:#6d28d9; --pvt-soft:#f1ebfd;
  --neg:#c92a2a; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s5:#e87ba4; --s7:#6250d6; --c-ov:#8a8f98; --c-biz:#eda100; --good:#2b8a3e; --warn:#e67700;
  --shadow:0 12px 40px rgba(20,20,30,.18);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111317; --panel:#181b20; --ink:#eceef1; --ink-2:#b5bac3; --ink-3:#7c828c;
    --line:#2a2e35; --line-2:#22252b; --accent:#7aa2ff; --accent-soft:#1d2740;
    --new:#ff8a4c; --new-soft:#33211a; --pub:#4fd1c5; --pub-soft:#16302d; --pvt:#b69cff; --pvt-soft:#261f3d;
    --neg:#ff6b6b; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s5:#d55181; --s7:#9085e9; --c-ov:#7c828c; --c-biz:#c98500; --good:#69db7c; --warn:#ffa94d;
    --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; font-feature-settings:"tnum"}
a{color:inherit}
button{font:inherit; color:inherit}
.wrap{max-width:1200px; margin:0 auto; padding:0 16px}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)} .neg{color:var(--neg)}
.r{text-align:right} .num{font-variant-numeric:tabular-nums}

/* header */
header{border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:20}
.top{display:flex; align-items:center; gap:20px; height:56px}
.brand{font-weight:800; letter-spacing:.02em; font-size:16px; text-decoration:none; white-space:nowrap}
.brand small{font-weight:600; color:var(--ink-3); font-size:11px; margin-left:6px; letter-spacing:.08em}
nav.main{display:flex; gap:2px}
nav.main a{text-decoration:none; color:var(--ink-3); font-weight:600; padding:6px 10px; border-radius:7px; white-space:nowrap}
nav.main a:hover{background:var(--line-2); color:var(--ink)}
nav.main a.on{color:var(--ink); background:var(--line-2)}
.search{position:relative; margin-left:auto; width:260px}
.search input[type=search]{width:100%; font:inherit; font-size:13px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:7px 10px 7px 30px; height:34px}
.search svg{position:absolute; left:9px; top:10px; color:var(--ink-3)}
.suggest{position:absolute; top:40px; left:0; right:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); overflow:hidden; display:none}
.suggest.on{display:block}
.suggest a{display:flex; gap:8px; align-items:baseline; padding:8px 12px; text-decoration:none; border-bottom:1px solid var(--line-2)}
.suggest a:last-child{border-bottom:0}
.suggest a.sel, .suggest a:hover{background:var(--accent-soft)}
.suggest .sub{margin-left:auto; font-size:12px; color:var(--ink-3); white-space:nowrap}

main{padding:20px 0 40px}
h1{font-size:22px; margin:0 0 4px; letter-spacing:-.01em}
h2{font-size:16px; margin:0 0 12px}
h3{font-size:14px; margin:0 0 8px}
.lead{color:var(--ink-2); margin:0 0 18px}

/* cards & grid */
.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px}
.card + .card{margin-top:14px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.sec-title{display:flex; align-items:baseline; gap:10px; margin-bottom:12px}
.sec-title h2{margin:0}
.sec-title .src{margin-left:auto; font-size:12px; color:var(--ink-3)}

/* kpis */
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:0 0 8px}
.kpi{background:var(--panel); padding:14px 16px; cursor:pointer; text-align:left; border:0}
.kpi:hover{background:var(--line-2)}
.kpi .l{font-size:12px; color:var(--ink-3)}
.kpi .v{font-size:22px; font-weight:700; margin-top:2px; letter-spacing:-.01em}
.kpi .s{font-size:12px; color:var(--ink-2)}
.note{font-size:12px; color:var(--ink-3)}

/* tiles */
.tiles{display:grid; grid-template-columns:repeat(6,1fr); gap:10px}
.tile{border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--panel)}
.tile .l{font-size:12px; color:var(--ink-3)}
.tile .v{font-size:18px; font-weight:700; margin-top:2px}
.tile .s{font-size:11px; color:var(--ink-3)}

/* tabs + filters */
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; border-bottom:1px solid var(--line)}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.tab{appearance:none; border:0; background:none; color:var(--ink-3); font-weight:600; padding:10px 12px; border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink); border-color:var(--ink)}
.tab .n{font-weight:500; color:var(--ink-3); margin-left:4px; font-size:12px}
.filters{display:flex; gap:8px; align-items:center; margin-left:auto; padding:6px 0; flex-wrap:wrap}
select,input[type=search],input[type=date],input[type=number]{font:inherit; font-size:13px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:5px 9px; height:32px}
input[type=search]{width:170px}
input[type=number]{width:90px}
.chips{display:flex; gap:4px; flex-wrap:wrap}
.chip{font-size:12px; font-weight:600; border:1px solid var(--line); background:var(--panel); color:var(--ink-2); border-radius:999px; padding:4px 10px; cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.btn{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 12px; cursor:pointer; text-decoration:none; white-space:nowrap}
.btn:hover{background:var(--line-2)}
.btn.primary{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.btn.primary:hover{opacity:.9}

/* table */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:0 0 10px 10px; border-top:0}
.panel.round{border-radius:10px; border-top:1px solid var(--line)}
.scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse}
table.list{min-width:860px}
th,td{padding:9px 12px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--line-2)}
th{font-size:12px; font-weight:600; color:var(--ink-3); background:var(--panel)}
th.sort{cursor:pointer} th.sort:hover{color:var(--ink)}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--line-2)}
.kv td{white-space:normal; vertical-align:top}
.kv td:first-child{color:var(--ink-3); width:110px; white-space:nowrap}
.co{font-weight:600}
.co a{text-decoration:none} .co a:hover{text-decoration:underline}
.mk{display:inline-block; font-size:10px; font-weight:700; color:var(--ink-3); border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-left:6px; vertical-align:1px}
.badge{display:inline-block; font-size:11px; font-weight:700; border-radius:4px; padding:1px 6px; white-space:nowrap}
.b-new{color:var(--new); background:var(--new-soft); margin-left:6px}
.b-amd{color:var(--ink-3); border:1px solid var(--line); margin-left:6px; font-weight:600}
.b-pub{color:var(--pub); background:var(--pub-soft)}
.b-pvt{color:var(--pvt); background:var(--pvt-soft)}
.b-cbo{color:var(--ink-2); border:1px solid var(--line); margin-left:6px; font-weight:600}
.type{font-family:var(--mono); font-size:12px; font-weight:700}
.dart{font-size:12px; color:var(--accent); text-decoration:none}
.dart:hover{text-decoration:underline}
.empty{padding:40px 16px; text-align:center; color:var(--ink-3)}
.foot-note{padding:10px 12px; font-size:12px; color:var(--ink-3); border-top:1px solid var(--line-2)}
.pager{display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid var(--line-2); font-size:13px}
.pager .sp{margin-left:auto}

/* company */
.co-head{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap}
.co-head .meta{color:var(--ink-2); font-size:13px}
.co-head .actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.secnav{display:flex; gap:4px; flex-wrap:wrap; margin:16px 0}
.secnav a{font-size:13px; font-weight:600; text-decoration:none; color:var(--ink-2); border:1px solid var(--line); border-radius:999px; padding:4px 12px; background:var(--panel)}
.secnav a:hover{background:var(--line-2)}
.prose{white-space:pre-line; color:var(--ink); margin:0}
.share{display:flex; align-items:center; gap:8px}
.share .track{flex:1; height:6px; background:var(--line-2); border-radius:3px; min-width:60px}
.share .fill{height:6px; border-radius:3px; background:var(--s1)}
.pending{border:1px dashed var(--line); border-radius:10px; padding:14px; color:var(--ink-2); background:var(--bg)}

/* charts */
.chart{width:100%; height:auto; display:block}
.chart text{fill:var(--ink-3); font-size:11px; font-family:inherit}
.chart .grid{stroke:var(--line-2)}
.chart .base{stroke:var(--line)}
.legend{display:flex; gap:14px; font-size:12px; color:var(--ink-2); margin-top:6px; flex-wrap:wrap}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px}
#tip{position:fixed; pointer-events:none; background:var(--ink); color:var(--panel); font-size:12px; padding:6px 9px; border-radius:6px; z-index:60; display:none; white-space:nowrap; box-shadow:var(--shadow)}

/* company (발행사) */
.co-hero{display:flex; gap:16px 24px; align-items:center; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px}
.co-hero h1{margin:0}
.co-hero .meta{color:var(--ink-2); font-size:13px; margin-top:2px}
.co-hero .price{margin-left:auto; text-align:right}
.co-hero .price b{font-size:24px; letter-spacing:-.01em} .co-hero .price small{font-size:13px; font-weight:600; margin-left:2px}
.co-hero .price span{display:block; font-size:12px; color:var(--ink-3)}
.co-hero .actions{display:flex; gap:8px}
.mk-lg{font-size:12px; padding:1px 6px; vertical-align:4px}
.secnav.sticky{position:sticky; top:56px; z-index:10; background:var(--bg); padding:10px 0; margin:6px 0 10px}
.cgrid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; align-items:start}
.cgrid > *{min-width:0}
.cgrid .span2{grid-column:1 / -1}
.cgrid .card + .card{margin-top:0}
.sec{border-left:4px solid var(--s1); scroll-margin-top:110px}
.c-sum{border-left-color:var(--s1)} .c-ov{border-left-color:var(--c-ov)} .c-hold{border-left-color:var(--s5)} .c-biz{border-left-color:var(--c-biz)}
.c-pl{border-left-color:var(--s3)} .c-bs{border-left-color:var(--s2)} .c-peer{border-left-color:var(--s7)} .c-px{border-left-color:var(--neg)} .c-cr{border-left-color:var(--warn)} .c-deal{border-left-color:var(--s2)} .c-bond{border-left-color:var(--s1)}
.sec .sec-title{flex-wrap:wrap}
.sec .sec-title .sub{color:var(--ink-2); font-size:13px; font-weight:600}
.src-note{font-size:12px; color:var(--ink-3); margin:12px 0 0}
.facts{font-size:12px; color:var(--ink-3); margin:0 0 10px}
.oneliner{font-size:16px; font-weight:700; line-height:1.6; margin:0 0 16px; letter-spacing:-.005em}
.flow-title{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
.flow-title .muted{font-weight:500; font-size:12px}
.flow{display:flex; align-items:stretch; gap:6px; margin:8px 0 10px; overflow-x:auto; padding-bottom:4px}
.fcol{display:flex; flex-direction:column; gap:6px; min-width:120px; flex:1}
.fcol .fh{font-size:11px; font-weight:700; color:var(--ink-3); letter-spacing:.02em}
.fbox{position:relative; border:1px solid var(--line); border-radius:8px; padding:7px 9px; background:var(--bg); overflow:hidden}
.fbox b{display:block; font-size:13px; line-height:1.35}
.fbox span{display:block; font-size:11px; color:var(--ink-2); margin-top:1px}
.fbox.me{background:var(--accent-soft); border-color:transparent; flex:1; display:flex; flex-direction:column; justify-content:center}
.fbox.rev i{position:absolute; left:0; bottom:0; height:3px; background:var(--s1); border-radius:0 2px 2px 0}
.farrow{width:18px; flex:0 0 18px; position:relative}
.farrow::before{content:""; position:absolute; top:50%; left:2px; right:4px; height:2px; background:var(--line)}
.farrow::after{content:""; position:absolute; top:calc(50% - 4px); right:2px; border:5px solid transparent; border-left:6px solid var(--line); border-right:0}
.caption{color:var(--ink-2); font-size:13px; margin:6px 0 0; line-height:1.65}
.glance{border-top:1px solid var(--line-2)}
.glance a{display:flex; gap:12px; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line-2); text-decoration:none}
.glance a:hover{background:var(--line-2)}
.glance .gl{width:70px; flex:0 0 70px; font-weight:700; font-size:13px}
.glance .gt{flex:1; color:var(--ink-2); font-size:13px}
.glance .gc{color:var(--ink-3)}
.eq{font-size:13px; color:var(--ink-2); margin:8px 0 10px}
.tiles.t3{grid-template-columns:repeat(3,1fr)} .tiles.t4{grid-template-columns:repeat(4,1fr); margin-bottom:12px}
tr.me{background:var(--accent-soft)}
.ev em{font-style:normal; font-weight:700; color:var(--ink-3); margin-left:4px; font-size:11px}
details.scoreb summary, details.method summary{font-size:13px}
details.method ul{margin:8px 0 0; padding-left:18px; color:var(--ink-2); font-size:13px}
details.method li{margin:4px 0}

/* proposal */
.opt{border:1px solid var(--line); border-radius:10px; padding:14px 16px; background:var(--panel)}
.opt + .opt{margin-top:10px}
.opt-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.opt-head h3{margin:0; font-size:15px}
.rank{font-family:var(--mono); font-weight:700; color:var(--ink-3)}
.fit{font-size:11px; font-weight:700; border-radius:4px; padding:1px 7px}
.fit-높음{color:var(--good); border:1px solid currentColor}
.fit-보통{color:var(--warn); border:1px solid currentColor}
.fit-낮음{color:var(--ink-3); border:1px solid var(--line)}
.score{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-3)}
.score .track{width:90px; height:6px; background:var(--line-2); border-radius:3px}
.score .fill{height:6px; border-radius:3px; background:var(--ink-2)}
.opt ul{margin:8px 0 0; padding-left:18px}
.opt li{margin:2px 0}
.opt .why li::marker{content:"＋ "; color:var(--good)}
.opt .risk li::marker{content:"－ "; color:var(--neg)}
.opt .meta{font-size:12px; color:var(--ink-3); margin-top:8px}
.top3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.top3 .opt{margin:0}
details summary{cursor:pointer; color:var(--ink-2); font-weight:600; margin-top:10px}

/* calendar */
.cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-top:1px solid var(--line); border-left:1px solid var(--line)}
.cal .dow{font-size:12px; font-weight:600; color:var(--ink-3); padding:6px 8px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--panel)}
.cal .day{min-height:104px; padding:6px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--panel)}
.cal .day.out{background:var(--bg)}
.cal .day.out .dn{opacity:.4}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dn{font-size:12px; font-weight:700; color:var(--ink-2); margin-bottom:4px}
.ev{display:block; width:100%; text-align:left; border:0; border-left:3px solid; border-radius:4px; padding:3px 6px; margin-bottom:3px; font-size:12px; cursor:pointer; background:var(--line-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ev.dem{border-color:var(--s1)} .ev.iss{border-color:var(--s3)}
.ev b{font-weight:700; margin-right:4px}
.cal-head{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.cal-head h2{margin:0; min-width:120px}

/* modal */
.modal-bg{position:fixed; inset:0; background:rgba(10,12,16,.45); z-index:50; display:none; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow:auto}
.modal-bg.on{display:flex}
.modal{background:var(--panel); border-radius:14px; width:100%; max-width:640px; box-shadow:var(--shadow); border:1px solid var(--line)}
.modal-h{display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line-2); flex-wrap:wrap}
.modal-h h2{margin:0; font-size:18px}
.modal-h .x{margin-left:auto; border:0; background:none; font-size:22px; line-height:1; cursor:pointer; color:var(--ink-3); padding:4px}
.modal-b{padding:16px 18px}
.fields{display:grid; grid-template-columns:repeat(3,1fr); gap:12px 16px}
.fields .l{font-size:11px; color:var(--ink-3)}
.fields .v{font-weight:600}
.modal-b h3{margin:18px 0 8px}

footer{color:var(--ink-3); font-size:12px; padding:8px 0 40px}
footer p{margin:4px 0}

@media (max-width:900px){
  .tiles{grid-template-columns:repeat(3,1fr)}
  .grid3,.top3{grid-template-columns:1fr}
  .search{width:180px}
}
@media (max-width:900px){
  .cgrid{grid-template-columns:minmax(0,1fr)}
  .tiles.t4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .secnav.sticky{top:96px}
  .co-hero .price{margin-left:0; text-align:left}
  .flow{flex-direction:column}
  .fcol{min-width:0}
  .farrow{width:auto; height:16px; flex:0 0 16px}
  .farrow::before{top:2px; bottom:4px; left:50%; right:auto; width:2px; height:auto}
  .farrow::after{top:auto; bottom:0; left:calc(50% - 5px); right:auto; border:5px solid transparent; border-top:6px solid var(--line); border-bottom:0}
  .tiles.t3{grid-template-columns:repeat(2,1fr)}
  .top{height:auto; flex-wrap:wrap; padding:10px 16px; gap:8px 12px}
  nav.main{order:3; width:100%; overflow-x:auto}
  .search{width:auto; flex:1; margin-left:0}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi .v{font-size:19px}
  .grid2{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .filters{margin-left:0; width:100%}
  input[type=search]{flex:1; width:auto}
  .fields{grid-template-columns:repeat(2,1fr)}
  .cal .day{min-height:70px; padding:3px}
  .ev{font-size:10px; padding:2px 3px}
  .ev b{display:none}
}
@media print{
  header, footer, .noprint, .secnav{display:none !important}
  body{background:#fff; color:#000; font-size:12px}
  .card,.opt{break-inside:avoid; border-color:#ccc}
  main{padding:0}
  .top3{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <a class="brand" href="#/">__SITE_NAME__<small>BETA</small></a>
    <nav class="main" id="nav">
      <a href="#/" data-r="home">홈</a>
      <a href="#/deals" data-r="deals">전체 조달내역</a>
      <a href="#/calendar" data-r="calendar">공모채 캘린더</a>
    </nav>
    <div class="search">

  <p>공시를 자동으로 정리한 정보라 오류가 있을 수 있으며, 조달 제안은 공시 숫자에 기반한 참고 의견일 뿐 투자 권유가 아닙니다. 정확한 내용은 공시 원문을 확인하세요.</p>

<script>
(() => {
'use strict';
// ───────────── 공통 ─────────────
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kstDate = ms => new Intl.DateTimeFormat('sv-SE', {timeZone: 'Asia/Seoul'}).format(new Date(ms));
const todayIso = kstDate(Date.now());
const daysAgo = n => kstDate(Date.now() - n * 86400000);
const DASH = '<span class="muted">-</span>';
const won = v => {
  if (v == null || isNaN(v)) return DASH;
  const a = Math.abs(v), sign = v < 0 ? '-' : '';
  if (a >= 1e12) return sign + (a / 1e12).toLocaleString('ko-KR', {maximumFractionDigits: 1}) + '조';
  if (a >= 1e8) { const e = a / 1e8; return sign + (e >= 100 ? Math.round(e).toLocaleString('ko-KR') : (Math.round(e * 10) / 10).toLocaleString('ko-KR')) + '억'; }
  if (a >= 1e4) return sign + Math.round(a / 1e4).toLocaleString('ko-KR') + '만';
  return sign + a.toLocaleString('ko-KR');
};
const wonTxt = v => won(v).replace(/<[^>]+>/g, '');
const int = v => v == null ? DASH : Number(v).toLocaleString('ko-KR');
const pct = (v, d = 1) => v == null || isNaN(v) ? DASH : (+v).toFixed(d).replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1') + '%';
const md = s => s ? s.slice(2).replace(/-/g, '.') : DASH;
const fullDate = s => s ? s.replace(/-/g, '.') : DASH;
const ratio = (v, d = 1, unit = '배') => v == null ? DASH : (+v).toFixed(d) + unit;
const MK = {Y: '유', K: '코', N: '넥', E: '비상장'};
const MKF = {Y: '유가증권', K: '코스닥', N: '코넥스', E: '비상장'};
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('ecm:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ecm:' + k, JSON.stringify(v)); } catch (e) {} },
};

const cache = {};
const getJSON = url => cache[url] || (cache[url] = fetch(url, {cache: 'no-cache'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }));

// ───────────── 조달 행 공통 ─────────────
const dealDate = r => r.board_dt || r.sub_dt || r.issue_dt || r.rcept_dt || '';
const isNew = r => r.captured_by === 'watch' && !r.confirmed;
const typeLabel = r => r.type === 'BOND' ? (r.pcbo ? 'P-CBO' : '회사채') : r.type === 'RIGHTS' ? '유상증자' : r.type;
const kindKey = r => r.type === 'BOND' ? (r.pcbo ? 'P-CBO' : r.offering === '공모' ? '공모채' : '사모채') : r.type === 'RIGHTS' ? '유상증자' : r.type;
const coLink = (r, name) => `<a href="#/company/${encodeURIComponent(r.key)}" data-stop>${esc(name ?? r.corp_name)}</a>`;
const company = r => `<span class="co">${coLink(r)}</span>${MK[r.corp_cls] && r.corp_cls !== 'E' ? `<span class="mk">${MK[r.corp_cls]}</span>` : ''}`
  + (r.pcbo ? '<span class="badge b-cbo">P-CBO</span>' : '')
  + (isNew(r) ? '<span class="badge b-new">새</span>' : '')
  + (r.amended ? '<span class="badge b-amd">정정</span>' : '');
const offer = o => o === '공모' ? '<span class="badge b-pub">공모</span>' : o === '사모' ? '<span class="badge b-pvt">사모</span>' : esc(o || '-');
const dartLink = r => r.url ? `<a class="dart" href="${r.url}" target="_blank" rel="noopener" data-stop>원문</a>` : DASH;
const series = r => r.series ? esc(r.series) + '회' : DASH;
const priceOrRate = r => ['CB','BW','EB'].includes(r.type) ? int(r.price) + '<span class="muted"> 원</span>'
  : r.type === 'BOND' ? (r.issue_rate != null ? pct(r.issue_rate, 3) + '<span class="muted"> 발행</span>' : r.coupon != null ? pct(r.coupon, 3) : r.fix_rate != null ? pct(r.fix_rate, 3) + '<span class="muted"> 확정</span>' : r.fix_spread != null ? `<span class="muted">민평</span> ${r.fix_spread >= 0 ? '+' : ''}${r.fix_spread}bp` : r.band ? `<span class="muted">희망 ${esc(r.band)}</span>` : /수요예측/.test(r.coupon_raw || '') ? '<span class="muted">수요예측 후</span>' : DASH)
  : r.type === 'RIGHTS' ? (r.dilution != null ? pct(r.dilution) + '<span class="muted"> 증자</span>' : DASH) : DASH;

let ROWS_BY_ID = {};
function remember(rows) { rows.forEach(r => { ROWS_BY_ID[r.id] = r; }); return rows; }

// 행 클릭 → 팝업 (회사명·원문 링크는 그대로 이동)
app.addEventListener('click', e => {
  if (e.target.closest('[data-stop]')) return;
  const tr = e.target.closest('[data-deal]');
  if (tr && ROWS_BY_ID[tr.dataset.deal]) openDeal(ROWS_BY_ID[tr.dataset.deal]);
});

// ───────────── 툴팁 ─────────────
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.textContent = t.getAttribute('data-tip');
  tip.style.display = 'block';
  const w = tip.offsetWidth;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - w - 8) + 'px';
  tip.style.top = (e.clientY + 14) + 'px';
});

// ───────────── 차트 (SVG) ─────────────
// 단일 계열 막대: 0 기준선, 음수 아래로, 끝 4px 둥글게
function barChart(points, {height = 170, color = 'var(--s1)', fmt = wonTxt, label = ''} = {}) {
  const W = 360, H = height, padL = 6, padR = 6, padT = 18, padB = 22;
  const vals = points.map(p => p.v ?? 0);
  const max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  const span = (max - min) || 1;
  const y = v => padT + (max - v) / span * (H - padT - padB);
  const bw = Math.min(42, (W - padL - padR) / points.length * 0.55);
  const step = (W - padL - padR) / points.length;
  const r = 4;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  s += `<line class="base" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/>`;
  points.forEach((p, i) => {
    const cx = padL + step * i + step / 2, x = cx - bw / 2;
    if (p.v == null) { s += `<text x="${cx}" y="${y(0) - 4}" text-anchor="middle">-</text>`; }
    else {
      const y0 = y(0), y1 = y(p.v), h = Math.max(1, Math.abs(y1 - y0)), top = Math.min(y0, y1), neg = p.v < 0;
      const rr = Math.min(r, h, bw / 2);
      const d = neg
        ? `M${x},${top} h${bw} v${h - rr} q0,${rr} -${rr},${rr} h-${bw - 2 * rr} q-${rr},0 -${rr},-${rr} z`
        : `M${x},${top + h} v-${h - rr} q0,-${rr} ${rr},-${rr} h${bw - 2 * rr} q${rr},0 ${rr},${rr} v${h - rr} z`;
      s += `<path d="${d}" fill="${neg ? 'var(--neg)' : color}" opacity="${p.dim ? .45 : 1}"/>`;
      s += `<rect x="${cx - step / 2}" y="${padT - 14}" width="${step}" height="${H - padT - padB + 14}" fill="transparent" data-tip="${esc(p.label)} · ${esc(fmt(p.v))}"/>`;
      s += `<text x="${cx}" y="${neg ? y1 + 12 : y1 - 5}" text-anchor="middle" style="fill:var(--ink-2);font-weight:600">${esc(fmt(p.v))}</text>`;
    }
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return s + '</svg>';
}

// 선 그래프: 주가 추이 [[날짜, 종가], ...]
function lineChart(pts, {height = 180, label = ''} = {}) {
  const W = 720, H = height, padL = 6, padR = 52, padT = 12, padB = 22;
  const vs = pts.map(p => p[1]), max = Math.max(...vs), min = Math.min(...vs), span = (max - min) || 1;
  const x = i => padL + i / Math.max(1, pts.length - 1) * (W - padL - padR);
  const y = v => padT + (max - v) / span * (H - padT - padB);
  const up = vs[vs.length - 1] >= vs[0], col = up ? 'var(--neg)' : 'var(--s1)';
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  [max, (max + min) / 2, min].forEach(v => { s += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${W - padR + 6}" y="${y(v) + 4}">${int(Math.round(v))}</text>`; });
  s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
  const step = (W - padL - padR) / Math.max(1, pts.length - 1);
  pts.forEach((p, i) => { s += `<rect x="${x(i) - step / 2}" y="${padT}" width="${step}" height="${H - padT - padB}" fill="transparent" data-tip="${esc(md(p[0]))} · ${int(p[1])}원"/>`; });
  const ticks = [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
  ticks.forEach((i, k) => { s += `<text x="${x(i)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${esc(md(pts[i][0]))}</text>`; });
  return s + '</svg>';
}

// 누적 막대: 만기 구조 (공모 / 사모 / 주식연계)
function stackChart(rows, keys, colors) {
  const W = 720, H = 210, padL = 8, padR = 8, padT = 22, padB = 24;
  const tot = rows.map(r => keys.reduce((a, k) => a + (r[k] || 0), 0));
  const max = Math.max(1, ...tot);
  const step = (W - padL - padR) / Math.max(rows.length, 1);
  const bw = Math.min(46, step * 0.6);
  const yh = v => v / max * (H - padT - padB);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="연도별 사채 만기">`;
  s += `<line class="base" x1="${padL}" x2="${W - padR}" y1="${H - padB}" y2="${H - padB}"/>`;
  rows.forEach((r, i) => {
    const cx = padL + step * i + step / 2, x = cx - bw / 2;
    let yb = H - padB;
    const segs = keys.filter(k => r[k] > 0);
    segs.forEach((k, j) => {
      const h = yh(r[k]);
      const last = j === segs.length - 1;
      const gap = j > 0 ? 2 : 0;
      const top = yb - h;
      const hh = Math.max(1, h - gap);
      const rr = last ? Math.min(4, hh, bw / 2) : 0;
      const d = `M${x},${yb - gap} v-${hh - rr} ${rr ? `q0,-${rr} ${rr},-${rr} h${bw - 2 * rr} q${rr},0 ${rr},${rr}` : `h${bw}`} v${hh - rr} z`;
      s += `<path d="${d}" fill="${colors[keys.indexOf(k)]}"/>`;
      yb = top;
    });
    const label = keys.map(k => `${k} ${wonTxt(r[k] || 0)}`).join(' · ');
    s += `<rect x="${cx - step / 2}" y="${padT - 18}" width="${step}" height="${H - padT - padB + 18}" fill="transparent" data-tip="${esc(r.year)}년 만기 · ${esc(label)}"/>`;
    s += `<text x="${cx}" y="${yb - 6}" text-anchor="middle" style="fill:var(--ink-2);font-weight:600">${esc(wonTxt(tot[i]))}</text>`;
    s += `<text x="${cx}" y="${H - 7}" text-anchor="middle">${esc(r.year)}</text>`;
  });
  return s + '</svg>' + `<div class="legend">${keys.map((k, i) => `<span><i style="background:${colors[i]}"></i>${k}</span>`).join('')}</div>`;
}

// ───────────── 신용등급 트리거 ─────────────
function trigHtml(T) {
  if (!T) return '<div class="empty" style="padding:18px">신용평가 트리거 정보가 없습니다</div>';
  const fmtv = (v, u) => v == null ? DASH : (u === '%' ? v.toFixed(1) + '%' : u === '조원' ? v.toFixed(1) + '조원' : v.toFixed(2) + '배');
  const ag = `<div class="tiles t3">${T.agencies.map(a => `<div class="tile"><div class="l">${esc(a.agency)}${a.eval_date ? ' · ' + md(a.eval_date) : ''}</div><div class="v">${esc(a.rating || '-')}</div><div class="s ${/부정|하향/.test(a.outlook || '') ? 'neg' : ''}">${esc(a.outlook || '')}</div></div>`).join('')}</div>`;
  const Q = T.items.filter(x => x.metric !== '기타'), O = T.items.filter(x => x.metric === '기타');
  const st = x => x.cur == null ? '<span class="muted">계산 불가</span>'
    : x.met ? `<b class="${x.dir === 'down' ? 'neg' : ''}" style="${x.dir === 'up' ? 'color:var(--good)' : ''}">${x.dir === 'down' ? '하향 요인 충족' : '상향 요인 충족'}</b>`
    : `<span class="muted">여유 ${fmtv(Math.abs(x.gap), x.unit)}</span>`;
  const rows = Q.map(x => `<tr><td>${x.dir === 'down' ? '<span class="neg">하향</span>' : '<span style="color:var(--good)">상향</span>'}</td><td>${esc(x.agency)}</td><td>${esc(x.metric)} ${esc(x.op || '')} ${x.thr != null ? fmtv(x.thr, x.unit) : ''}</td><td class="r num">${fmtv(x.cur, x.unit)}</td><td>${st(x)}</td></tr>`).join('');
  return `${ag}${Q.length ? `<div class="scroll"><table class="list" style="min-width:520px;margin-top:10px"><thead><tr><th>방향</th><th>평가사</th><th>트리거</th><th class="r">현재</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}
    ${O.length ? `<details><summary>정성 요인 ${O.length}건</summary><ul style="margin:6px 0 0;padding-left:18px">${O.map(x => `<li><span class="${x.dir === 'down' ? 'neg' : ''}">${x.dir === 'down' ? '하향' : '상향'}</span> · ${esc(x.agency)} · ${esc(x.text || '')}</li>`).join('')}</ul></details>` : ''}
    <p class="note" style="margin:8px 0 0">현재값은 최근 사업보고서 재무로 계산 · 평가사 기준(조정 EBITDA·리스부채 포함 등)과 차이가 있을 수 있음</p>`;
}

// ───────────── 팝업: 종목 상세 ─────────────
const modal = $('#modal'), box = $('#modal-box');
function closeModal() { modal.classList.remove('on'); document.body.style.overflow = ''; }
modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('.x')) closeModal(); if (e.target.closest('a[href^="#/"]')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function field(l, v) { return v == null || v === '' || v === DASH ? '' : `<div><div class="l">${l}</div><div class="v">${v}</div></div>`; }
const INV_COL = {'증권': 'var(--s3)', '자산운용': 'var(--s1)', 'PEF': 'var(--s7)', '신기사·VC': 'var(--s2)', '캐피탈': 'var(--s5)', '은행': 'var(--c-biz)', '보험': 'var(--c-biz)', '공제·연기금': 'var(--c-biz)', '법인': 'var(--c-ov)', '개인': 'var(--c-ov)'};
function invGroups(L) { const g = {}; L.forEach(x => { g[x.kind] = (g[x.kind] || 0) + (x.amt || 0); }); const t = Object.values(g).reduce((a, b) => a + b, 0) || 1; return Object.entries(g).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, v, v / t * 100]); }
function invKinds(L) { return invGroups(L).map(([k, , p]) => `${k} ${p.toFixed(0)}%`).join(' · '); }
function invTable(L) {
  const G = invGroups(L), tot = L.reduce((a, x) => a + (x.amt || 0), 0) || 1;
  const bar = `<div style="display:flex;height:22px;border-radius:6px;overflow:hidden;margin:4px 0 10px">${G.map(([k, , p]) => `<div title="${esc(k)} ${p.toFixed(1)}%" style="width:${p}%;background:${INV_COL[k] || 'var(--c-ov)'}"></div>`).join('')}</div>`;
  const rows = [...L].sort((a, b) => (b.amt || 0) - (a.amt || 0)).map(x => `<tr><td style="white-space:nowrap"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:${INV_COL[x.kind] || 'var(--c-ov)'}"></i>${esc(x.kind)}</td><td style="white-space:normal;word-break:keep-all">${x.name ? esc(x.name) : '<span class="muted">개인</span>'}${x.rel ? ` <span class="note">${esc(x.rel)}</span>` : ''}</td><td class="r num">${won(x.amt)}</td><td class="r num">${pct(x.amt / tot * 100, 1)}</td></tr>`).join('');
  return `<h3 style="margin:16px 0 6px;font-size:15px">투자자 <span class="muted" style="font-weight:400">공시 대상자별 발행내역</span></h3>${bar}
    <div class="legend">${G.map(([k, , p]) => `<span><i style="background:${INV_COL[k] || 'var(--c-ov)'}"></i>${esc(k)} ${p.toFixed(1)}%</span>`).join('')}</div>
    <div><table class="list" style="min-width:0;width:100%"><thead><tr><th>구분</th><th>투자자</th><th class="r">금액</th><th class="r">비중</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
window.openDeal = r => openDeal(r);
const STAGE = {'최초': '최초 신고 (수요예측 전)', '정정': '정정 (금리 결정)', '발행확정': '발행조건 확정', '발행': '발행 완료'};
function openDeal(r) {
  const head = `<span class="badge ${r.type === 'BOND' ? (r.offering === '공모' ? 'b-pub' : 'b-pvt') : 'b-amd'}" style="margin:0">${esc(kindKey(r))}</span>
    <h2>${esc(r.corp_name)} ${r.series ? esc(r.series) + '회' : ''} ${r.type !== 'BOND' && r.type !== 'RIGHTS' ? esc(r.type) : ''}</h2>
    ${r.corp_cls && r.corp_cls !== 'E' ? `<span class="mk" style="margin:0">${MK[r.corp_cls]}</span>` : ''}
    <button class="x" aria-label="닫기">×</button>`;
  let f = '', extra = '';
  if (['CB', 'BW', 'EB'].includes(r.type)) {
    f = field('권면총액', won(r.amount)) + field('발행방식', offer(r.offering)) + field('이사회 결의일', md(r.board_dt))
      + field('표면이자율', pct(r.coupon, 2)) + field('만기이자율', pct(r.ytm, 2)) + field('만기일', md(r.maturity))
      + field(r.type === 'CB' ? '전환가액' : r.type === 'BW' ? '행사가액' : '교환가액', r.price ? int(r.price) + '원' : null)

const gq = $('#gq'), sug = $('#suggest');
let COS = null, sel = -1;
const loadCos = () => COS ? Promise.resolve(COS) : getJSON('data/companies.json').then(x => (COS = x));
gq.addEventListener('focus', loadCos);
gq.addEventListener('input', debounce(async () => {
  const q = gq.value.trim().replace(/\s/g, '').toLowerCase();
  if (!q) { sug.classList.remove('on'); return; }
  const cos = await loadCos();
  const hit = cos.filter(c => c[1].replace(/\s/g, '').toLowerCase().includes(q) || c[3] === q.toUpperCase())
    .sort((a, b) => (a[1].replace(/\s/g, '').toLowerCase().startsWith(q) ? 0 : 1) - (b[1].replace(/\s/g, '').toLowerCase().startsWith(q) ? 0 : 1) || b[5] - a[5])
    .slice(0, 8);
  sel = -1;
  sug.innerHTML = hit.length ? hit.map(c => `<a href="#/company/${encodeURIComponent(c[0])}"><b>${esc(c[1])}</b>${c[2] && c[2] !== 'E' ? `<span class="mk">${MK[c[2]]}</span>` : ''}<span class="sub">${esc(c[4] || '')}${c[5] ? ` · 조달 ${c[5]}건` : ''}</span></a>`).join('')
    : '<div class="empty" style="padding:14px">찾는 회사가 없습니다</div>';
  sug.classList.add('on');
}, 120));
gq.addEventListener('keydown', e => {
  const items = $$('a', sug);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((a, i) => a.classList.toggle('sel', i === sel));
  } else if (e.key === 'Enter' && items.length) { location.hash = (items[Math.max(sel, 0)]).getAttribute('href'); sug.classList.remove('on'); gq.blur(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) sug.classList.remove('on'); else if (e.target.closest('.suggest a')) { sug.classList.remove('on'); gq.value = ''; } });

async function viewHome() {
  const [meta, rows] = await Promise.all([getJSON('data/meta.json'), getJSON('data/deals_recent.json')]);
  remember(rows);
  const st = {tab: store.get('home-tab', 'mezz'), period: store.get('home-period', 30), q: '', chips: new Set()};
  if (!S[st.tab]) st.tab = 'mezz';
  const stamp = s => s ? s.slice(0, 16).replace('T', ' ') : '-';
  const since14 = daysAgo(14);
  app.innerHTML = `
    <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px">
      <div><h1>자본시장 조달 한눈에</h1><div class="note">데이터 기준 ${stamp(meta.data_updated)} · 정기 갱신 ${stamp(meta.last_daily)}</div></div>
      <a class="btn" href="#/deals" style="margin-left:auto">전체 조달내역 →</a><a class="btn" href="#/calendar">공모채 캘린더 →</a>
    </div>
    <section class="kpis">${Object.entries(S).map(([k, s]) => {
      const list = rows.filter(r => s.pick(r) && (s.date(r) || '') >= since14);
      const sum = list.reduce((a, r) => a + (r.amount || 0), 0);
      return `<button class="kpi" data-tab="${k}"><div class="l">${s.kpi}</div><div class="v">${list.length}건</div><div class="s">${sum ? won(sum) : '-'}</div></button>`;
    }).join('')}</section>
    <div class="note" style="margin-bottom:18px">최근 2주 기준 · 메자닌·유상증자는 이사회 결의일, 공모채는 청약일, 사모채는 발행일</div>
    <div class="bar"><div class="tabs" role="tablist" id="tabs"></div>
      <div class="filters"><div class="chips" id="chips"></div>
        <select id="period" aria-label="기간"><option value="14">최근 2주</option><option value="30">최근 1개월</option><option value="90">최근 3개월</option></select>
        <input type="search" id="q" placeholder="회사명 검색" aria-label="회사명 검색"></div></div>
    <div class="panel"><div class="scroll"><table class="list"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="foot-note" id="note"></div></div>`;
  $$('.kpi').forEach(b => b.onclick = () => { st.tab = b.dataset.tab; st.chips.clear(); render(); });
  $('#period').value = String(st.period);
  $('#period').onchange = e => { st.period = +e.target.value; store.set('home-period', st.period); render(); };
  $('#q').oninput = e => { st.q = e.target.value.trim(); render(); };
  const filtered = (s, withChips = true) => {
    const since = daysAgo(st.period);
    return rows.filter(r => s.pick(r) && (s.date(r) || '') >= since && (!st.q || (r.corp_name || '').includes(st.q))
      && (!withChips || !st.chips.size || [...st.chips].some(c => s.chipTest(r, c))))
      .sort((a, b) => (s.date(b) || '').localeCompare(s.date(a) || ''));
  };
  function render() {
    const s = S[st.tab];
    store.set('home-tab', st.tab);
    $('#tabs').innerHTML = Object.entries(S).map(([k, t]) => `<button class="tab" role="tab" aria-selected="${k === st.tab}" data-k="${k}">${t.label}<span class="n">${filtered(t, false).length}</span></button>`).join('');
    $$('.tab').forEach(b => b.onclick = () => { st.tab = b.dataset.k; st.chips.clear(); render(); });
    $('#chips').innerHTML = s.chips.map(c => `<button class="chip" aria-pressed="${st.chips.has(c)}" data-c="${c}">${c}</button>`).join('');
    $$('.chip').forEach(b => b.onclick = () => { st.chips.has(b.dataset.c) ? st.chips.delete(b.dataset.c) : st.chips.add(b.dataset.c); render(); });
    $('#thead').innerHTML = '<tr>' + s.cols.map(([h, , c]) => `<th class="${c || ''}">${h}</th>`).join('') + '</tr>';
    const list = filtered(s);
    $('#tbody').innerHTML = list.length ? list.map(r => `<tr class="click" data-deal="${esc(r.id)}">` + s.cols.map(([, f, c]) => `<td class="${c ? c + ' num' : ''}">${f(r)}</td>`).join('') + '</tr>').join('')
      : `<tr><td colspan="${s.cols.length}"><div class="empty">조건에 맞는 공시가 없습니다</div></td></tr>`;
    $('#note').textContent = s.note;
  }
  render();
}

function downloadCSV(list) {
  const head = ['날짜', '회사명', '시장', '종류', '방식', '회차', '금액(원)', '표면금리(%)', '행사가(원)', '만기', '접수번호', '원문'];
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [head.join(',')].concat(list.map(r => [dealDate(r), r.corp_name, MKF[r.corp_cls] || '비상장', kindKey(r), r.type === 'RIGHTS' ? r.method : r.offering,
    r.series, r.amount, r.coupon, r.price, r.maturity, r.rcept_no, r.url].map(q).join(',')));
  const blob = new Blob(['﻿' + lines.join('\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `조달내역_${todayIso}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function viewCalendar(params) {

const finRows = [
  ['매출액', 'revenue', won], ['영업이익', 'op', won], ['당기순이익', 'ni', won], ['영업이익률', 'op_margin', v => pct(v)], ['순이익률', 'net_margin', v => pct(v)]];
const bsRows = [['자산총계', 'assets', won], ['부채총계', 'liab', won], ['자본총계', 'equity', won], ['부채비율', 'debt_ratio', v => pct(v, 0)], ['유동비율', 'current_ratio', v => pct(v, 0)]];
const yy = p => /^\d{4}$/.test(p) ? p.slice(2) + '년' : p.replace(/^20(\d\d) /, '$1.');

// 묶음 막대: 기간별로 여러 계열 (예: 매출·영업이익). 0 기준선, 음수 아래, 끝 4px 둥글게, 막대 사이 2px
function groupChart(cats, series, {height = 200, labelFirst = true} = {}) {
  const W = 560, H = height, padL = 6, padR = 6, padT = 20, padB = 24;
  const all = series.flatMap(s => s.values.filter(v => v != null));
  const max = Math.max(0, ...all), min = Math.min(0, ...all), span = (max - min) || 1;
  const y = v => padT + (max - v) / span * (H - padT - padB);
  const step = (W - padL - padR) / cats.length;
  const bw = Math.min(30, step * 0.7 / series.length);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  s += `<line class="base" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/>`;
  cats.forEach((c, i) => {
    const cx = padL + step * i + step / 2, x0 = cx - (bw * series.length + 2 * (series.length - 1)) / 2;
    series.forEach((se, j) => {
      const v = se.values[i];
      if (v == null) return;
      const x = x0 + j * (bw + 2), y0 = y(0), y1 = y(v), h = Math.max(1, Math.abs(y1 - y0)), top = Math.min(y0, y1), rr = Math.min(4, h, bw / 2);
      const d = v < 0 ? `M${x},${top} h${bw} v${h - rr} q0,${rr} -${rr},${rr} h-${bw - 2 * rr} q-${rr},0 -${rr},-${rr} z`
        : `M${x},${top + h} v-${h - rr} q0,-${rr} ${rr},-${rr} h${bw - 2 * rr} q${rr},0 ${rr},${rr} v${h - rr} z`;
      s += `<path d="${d}" fill="${v < 0 && se.negColor ? se.negColor : se.color}" opacity="${se.dim && se.dim[i] ? .5 : 1}"/>`;
      if (labelFirst && j === 0) s += `<text x="${x + bw / 2}" y="${v < 0 ? y1 + 12 : y1 - 5}" text-anchor="middle" style="fill:var(--ink-2);font-weight:600;font-size:10px">${esc(wonTxt(v))}</text>`;
    });
    const tipTxt = `${c} · ` + series.map(se => `${se.name} ${se.values[i] == null ? '-' : wonTxt(se.values[i])}`).join(' · ');
    s += `<rect x="${cx - step / 2}" y="${padT - 16}" width="${step}" height="${H - padT - padB + 16}" fill="transparent" data-tip="${esc(tipTxt)}"/>`;
    s += `<text x="${cx}" y="${H - 7}" text-anchor="middle">${esc(c)}</text>`;
  });
  return s + '</svg>' + `<div class="legend">${series.map(se => `<span><i style="background:${se.color}"></i>${se.name}</span>`).join('')}</div>`;
}

function glanceRows(co) {
  const m = co.metrics || {}, I = co.info || {}, L = co.listing || {}, H = co.holders || {}, BP = co.bonds || {};
  const rows = [];
  const est = I.est_dt ? I.est_dt.slice(0, 4) + ' 설립' : '';
  const lst = L.listed ? L.listed.slice(0, 4) + ' 상장' : (co.market === 'E' ? '비상장' : '');
  rows.push(['개요', 's-ov', [I.ceo_nm || L.ceo ? '대표 ' + (I.ceo_nm || L.ceo) : '', est, lst].filter(Boolean).join(' · ')]);
  if (m.revenue != null) rows.push(['손익', 's-pl', `${yy(m.period)} 매출 ${wonTxt(m.revenue)}${m.revenue_growth != null ? ` (${m.revenue_growth > 0 ? '+' : ''}${m.revenue_growth.toFixed(1)}%)` : ''} · 영업이익률 ${pct(m.op_margin).replace(/<[^>]+>/g, '')}`]);
  if (m.debt_ratio != null) rows.push(['재무상태', 's-bs', `부채비율 ${m.debt_ratio.toFixed(0)}%${m.cash != null ? ' · 현금성자산 ' + wonTxt((m.cash || 0) + (m.st_deposits || 0)) : ''}${m.debt != null ? ' · 차입금 ' + wonTxt(m.debt) : ''}`]);
  if (H.top?.length) rows.push(['주주', 's-hold', `${H.top[0].name} 외 ${(H.total_pct ?? 0).toFixed(1)}%${H.as_of ? ' · ' + H.as_of.replace(/-/g, '.') + ' 기준' : ''}`]);
  const P = co.peers || [];
  if (P.length > 1) { const rank = [...P].sort((a, b) => (b.revenue || 0) - (a.revenue || 0)).findIndex(p => p.me) + 1; rows.push(['업종', 's-peer', `${co.industry} · 매출 비슷한 ${P.length}곳 중 매출 ${rank}위`]); }
  const h = co.history || [];
  if (h.length) rows.push(['조달 이력', 's-deal', '최근 3년 ' + h.slice(0, 3).map(x => `${x.label} ${x.count}건`).join(' · ') + ` · 합계 ${wonTxt(h.reduce((a, x) => a + x.amount, 0))}`]);
  if (BP.count) rows.push(['잔존 사채', 's-bond', `${wonTxt(BP.total)} · 12개월 내 만기 ${wonTxt(BP.due12 || 0)}`]);
  const top = (co.proposal || [])[0];
  if (top) rows.push(['조달 제안', 'report', `1순위 ${top.title} · 적합도 ${top.fit}`]);
  return rows;
}

function dealTable(deals) {
  if (!deals.length) return '<div class="empty">수집된 조달 기록이 없습니다</div>';
  return `<div class="scroll"><table class="list" style="min-width:620px"><thead><tr><th>날짜</th><th>종류</th><th>방식</th><th>회차</th><th class="r">금액</th><th class="r">금리·행사가</th><th>만기</th><th></th></tr></thead><tbody>
    ${deals.map(r => `<tr class="click" data-deal="${esc(r.id)}"><td>${md(dealDate(r))}</td><td><span class="type">${esc(kindKey(r))}</span>${r.amended ? '<span class="badge b-amd">정정</span>' : ''}</td><td>${r.type === 'RIGHTS' ? esc(r.method || '-') : offer(r.offering)}</td><td>${series(r)}</td><td class="r num">${won(r.amount)}</td><td class="r num">${priceOrRate(r)}</td><td>${md(r.maturity)}</td><td>${dartLink(r)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

      ${co.triggers ? card('s-cr', 'c-cr span2', '신용등급 트리거', esc(co.triggers.agencies.map(a => `${a.agency} ${a.rating || ''}${a.outlook ? '(' + a.outlook + ')' : ''}`).join(' · ')), trigHtml(co.triggers), '출처: 신용평가사 평가보고서 (수기 정리 자료)') : ''}
      ${PH.length > 1 ? card('s-px', 'c-px span2', '주가', esc(`${md(PH[0][0])} 이후 ${pxChg >= 0 ? '+' : ''}${pxChg.toFixed(1)}%`), pxBody, '종가 기준 · 출처: 금융위원회 주식시세정보') : ''}
      ${card('s-peer', 'c-peer span2', '업종', esc(co.industry || ''), peerBody, P.length > 1 ? `같은 업종(KIND 분류) 상장사 중 매출이 가장 가까운 곳 · 사업이 같은 비교기업은 아닐 수 있음${co.price_date ? ' · 시총 ' + md(co.price_date) : ''}` : '')}
      ${card('s-deal', 'c-deal span2', '조달 이력', `${(co.deals || []).length}건 · 행을 누르면 상세`, dealTable(co.deals || []), '출처: DART 주요사항보고서·증권신고서 · 금융위원회 채권기본정보')}
      ${card('s-bond', 'c-bond span2', '잔존 사채 만기', BP.count ? esc(`${wonTxt(BP.total)} · ${BP.count}종목`) : '', bondBody, BP.count ? '출처: 금융위원회 채권기본정보(한국예탁결제원) · 법인등록번호로 연결 · 일반회사채만' : '')}
    </div>`;
  $$('[data-jump]').forEach(a => a.onclick = e => { e.preventDefault(); const t = $(a.getAttribute('href')); if (t) scrollTo({top: t.getBoundingClientRect().top + scrollY - 110, behavior: 'smooth'}); });
  loadCos().then(cos => { const byCode = {}; cos.forEach(c => { if (c[3]) byCode[c[3]] = c[0]; });
    $$('[data-peer]').forEach(a => { const k = byCode[a.dataset.peer]; if (k) a.href = '#/company/' + encodeURIComponent(k); }); });
}

// ───────────── 조달 제안 보고서 ─────────────
const OPT_Q = {

  rights: ['최대주주 참여 의사와 규모', '자금 용도(시설·운영·차입금 상환)의 구체성', '할인율·일정(권리락 등)'],
  hybrid: ['자본 인정 요건(회계·신용평가) 충족 구조', '콜 시점과 스텝업 수용 범위', '상장 계획(RCPS의 경우)'],
};
const OPT_MATCHABLE = new Set(['public_bond', 'private_bond', 'pcbo', 'cb', 'eb', 'rights']);
function scoreTable(o) {
  const sum = o.base + (o.factors || []).reduce((a, f) => a + f.pts, 0);
  const rows = (o.factors || []).filter(f => f.pts !== 0);
  return `<details class="scoreb"><summary>점수 산정 ${o.score}점 = 기본 ${o.base}점 ${rows.map(f => (f.pts > 0 ? '+ ' : '− ') + Math.abs(f.pts)).join(' ')}${sum !== o.score ? ` (${sum}점 → 0~100 범위로 조정)` : ''}</summary>
    <table style="margin-top:6px"><tbody><tr><td class="r num" style="width:60px">${o.base}</td><td class="muted">기본점수 — 이 방식의 출발점</td></tr>
    ${rows.map(f => `<tr><td class="r num ${f.pts < 0 ? 'neg' : ''}" style="color:${f.pts > 0 ? 'var(--good)' : ''}">${f.pts > 0 ? '+' : '−'}${Math.abs(f.pts)}</td><td>${esc(f.text)}</td></tr>`).join('')}
    <tr><td class="r num"><b>${o.score}</b></td><td><b>합계</b> <span class="note">적합도 ${o.fit} (65점 이상 높음 · 45~64 보통 · 그 아래 낮음)</span></td></tr></tbody></table></details>`;
}
const METHOD_HTML = `<details class="method"><summary>점수는 이렇게 매깁니다</summary>
  <ul>
    <li><b>기본점수</b>에서 출발합니다 — 공모채 20 · 사모채 25 · P-CBO 10 · CB 10 · EB 0 · 유상증자 10 · 자본성 증권 5. 특별한 조건이 없을 때 시장에서 흔히 쓰이는 정도를 반영한 값입니다.</li>
    <li>공시로 확인되는 조건마다 <b>가점·감점</b>을 더합니다: 신용등급(공모채 증권신고서), 매출·자산 규모, 영업손익, 부채비율, 자본잠식, 12개월 내 만기 사채(예탁원 잔존 사채), 최근 3년 조달 이력, 상장 시장, 자기주식, 최대주주 지분, 시가총액.</li>
    <li>합계를 0~100으로 자르고 <b>65점 이상 높음 · 45~64 보통 · 그 아래 낮음</b>으로 표시합니다. 각 방식의 '점수 산정'을 펼치면 항목별 가감점을 볼 수 있습니다.</li>
    <li><b>비교 사례</b>는 최근 1년 같은 종류의 발행 중에서 고릅니다. 공모채는 신용등급이 한 단계 안쪽인 회사(같은 업종 우선), 나머지는 같은 업종을 먼저, 부족하면 같은 시장에서 매출이 1/3~3배인 회사를 고르며 회사당 1건만 넣습니다.</li>
    <li>회사의 실제 자금 수요·주가·시장 금리는 반영되지 않으니, 미팅 전에 확인해 조정해야 합니다.</li>
  </ul></details>`;
async function viewReport(key) {

      ${!compact ? scoreTable(o) : ''}
      ${!compact ? (o.comps?.length ? `<details open><summary>비교 사례 · 최근 1년 ${o.comps.length}곳</summary><div class="scroll"><table style="margin-top:6px;min-width:560px"><thead><tr><th>날짜</th><th>회사</th><th class="r">금액</th><th class="r">금리·행사가</th><th>등급</th><th>고른 근거</th></tr></thead><tbody>${o.comps.map(c => `<tr class="click" data-deal="${esc(c.id)}"><td>${md(c.date)}</td><td class="co"><a href="#/company/${encodeURIComponent(c.key)}" data-stop>${esc(c.corp_name)}</a>${c.series ? ` <span class="note">${esc(c.series)}회</span>` : ''}</td><td class="r num">${won(c.amount)}</td><td class="r num">${c.coupon != null ? pct(c.coupon, 2) : c.price ? int(c.price) + '원' : DASH}</td><td>${esc(c.rating || '')}</td><td class="note">${esc(c.basis || '')}</td></tr>`).join('')}</tbody></table></div></details>` : (OPT_MATCHABLE.has(o.key) ? '<p class="note" style="margin:8px 0 0">비교 사례 없음 — 최근 1년 안에 같은 업종(공모채는 비슷한 등급) 또는 같은 시장·비슷한 매출 규모 회사의 발행이 없습니다.</p>' : '')) : ''}
      ${!compact && OPT_Q[o.key] ? `<div class="meta" style="margin-top:10px">확인할 것: ${OPT_Q[o.key].map(esc).join(' · ')}</div>` : ''}
    </div>`;
  // 상세 보고서에서 비교 사례 클릭을 위해 등록
  getJSON('data/deals.json').then(rows => remember(rows)).catch(() => {});
  const H = (co.history || []);
  const checks = [
    ['수익성', m.op_margin != null ? `영업이익률 ${pct(m.op_margin)}${m.loss_years ? ` · 최근 ${m.loss_years}개년 영업손실` : ''}` : '정보 없음', m.op_margin == null ? '' : m.op_margin < 0 ? 'neg' : ''],
    ['레버리지', m.debt_ratio != null ? `부채비율 ${pct(m.debt_ratio, 0)}${m.net_debt_ebitda != null ? ` · 순차입금/EBITDA ${ratio(m.net_debt_ebitda)}` : ''}` : '정보 없음', m.debt_ratio > 300 ? 'neg' : ''],
    ['이자 상환력', m.interest_coverage != null ? `이자보상배율 ${ratio(m.interest_coverage)}` : '정보 없음', m.interest_coverage != null && m.interest_coverage < 1 ? 'neg' : ''],
    ['유동성', m.current_ratio != null ? `유동비율 ${pct(m.current_ratio, 0)}${m.cash != null ? ` · 현금성자산 ${wonTxt((m.cash || 0) + (m.st_deposits || 0))}` : ''}` : '정보 없음', m.current_ratio != null && m.current_ratio < 100 ? 'neg' : ''],
    ['자본 상태', m.impairment ? `자본${m.impairment}` : (m.equity != null ? '잠식 없음' : '정보 없음'), m.impairment ? 'neg' : ''],
    ['차환 부담', BP.due12 ? `12개월 내 만기 사채 ${wonTxt(BP.due12)}` : (BP.count ? '12개월 내 만기 없음' : '잔존 사채 정보 없음'), ''],
    ['신용등급', co.rating ? `${esc(co.rating_src || co.rating)}` : '확인된 등급 없음', ''],
    ['시장 가치', m.mcap ? `시가총액 ${wonTxt(m.mcap)}${m.per ? ` · PER ${ratio(m.per)}` : ''}${m.pbr ? ` · PBR ${ratio(m.pbr, 2)}` : ''}` : (co.market === 'E' ? '비상장' : '주가 정보 없음'), ''],
  ];
  app.innerHTML = `
    <div class="noprint" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><a class="btn" href="#/company/${encodeURIComponent(co.key)}">← 회사 화면</a><button class="btn" onclick="print()" style="margin-left:auto">인쇄 / PDF 저장</button></div>
    <div class="card">
      <div class="note">조달 제안 보고서 · ${todayIso.replace(/-/g, '.')} 작성</div>
      <h1 style="margin-top:4px">${esc(co.name)} <span class="mk" style="font-size:12px">${MKF[co.market] || '비상장'}</span></h1>
      <div class="ink2">${[co.industry, co.listing?.products].filter(Boolean).map(esc).join(' · ')}</div>
      <p style="margin:12px 0 0">${esc(co.summary || '')}</p>
    </div>
    <section class="card"><h2>1. 추천 조달 방식</h2><div class="top3">${top.map((o, i) => optCard(o, i, true)).join('')}</div>

      ${co.ai?.caption ? `<p class="caption">${esc(co.ai.caption)}</p>` : (B.overview_short ? `<p class="prose" style="margin-bottom:10px">${esc(B.overview_short)}</p>` : '')}
      ${!co.ai && B.products?.length ? `<p class="ink2" style="margin:0 0 6px"><b>주요 제품</b> · ${B.products.slice(0, 5).map(p => esc(p.segment ? p.segment + ' ' : '') + esc(p.name) + (p.share != null ? ` (${pct(p.share)})` : '')).join(', ')}</p>` : ''}
      ${(co.ai?.customers || B.customers_short) ? `<p class="ink2" style="margin:6px 0 0"><b>주요 매출처</b> · ${esc(co.ai?.customers || B.customers_short)}</p>` : ''}
      ${!co.ai && !B.overview && !B.products?.length ? '<p class="muted" style="margin:0">사업보고서 기반 사업 내용이 아직 수집되지 않았습니다.</p>' : ''}
    </section>
    <section class="card"><h2>3. 재무 체크포인트</h2><table class="kv"><tbody>${checks.map(([l, v, c]) => `<tr><td>${l}</td><td class="${c}">${v}</td></tr>`).join('')}</tbody></table>
      <p class="note" style="margin:8px 0 0">${esc(m.period ? m.period + '년 사업보고서' : '')}${m.detail_period ? ' · 세부 항목 ' + esc(m.detail_period) : ''} 기준</p></section>
    ${co.triggers ? `<section class="card"><h2>3-1. 신용등급 트리거</h2>${trigHtml(co.triggers)}</section>` : ''}
    <section class="card"><h2>4. 조달 이력과 만기</h2>
      ${H.length ? `<p class="ink2" style="margin:0 0 10px">최근 3년: ${H.map(h => `${esc(h.label)} ${h.count}건 ${wonTxt(h.amount)} (최근 ${md(h.last)})`).join(' · ')}</p>` : '<p class="muted">최근 3년 수집된 조달 기록이 없습니다.</p>'}
      ${BP.count ? stackChart(BP.ladder || [], ['공모', '사모', '주식연계'], ['var(--s1)', 'var(--s2)', 'var(--s3)']) : ''}
      ${(co.deals || []).length ? `<details><summary>조달 기록 ${co.deals.length}건</summary>${dealTable(co.deals)}</details>` : ''}

    <section class="card"><h2>5. 방식별 검토</h2>${opts.map((o, i) => optCard(o, i, false)).join('')}</section>

      <li>자금 용도와 필요 시점 (시설투자·운영자금·차환·M&A)</li><li>희망 조달 규모와 금리·희석 허용 범위</li>
      ${top.flatMap(o => (OPT_Q[o.key] || []).slice(0, 2)).map(q => `<li>${esc(q)}</li>`).join('')}
      <li>최근 공시 이후 바뀐 사항 (분기 실적·신용등급·최대주주 변동)</li></ul></section>

// ───────────── 라우터 ─────────────
async function route() {
  closeModal();
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = h.split('?');
  const params = new URLSearchParams(qs || '');
  const parts = path.split('/').filter(Boolean);
  const r = parts[0] || 'home';
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === r));
  document.title = '__SITE_NAME__ · 자본시장 조달 공시';
  try {
    if (r === 'deals') await viewDeals(params);
    else if (r === 'calendar') await viewCalendar(params);
    else if (r === 'company' && parts[1]) await viewCompany(decodeURIComponent(parts[1]));
    else if (r === 'report' && parts[1]) await viewReport(decodeURIComponent(parts[1]));
    else await viewHome();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="empty">화면을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.<br><span class="note">${esc(e.message)}</span></div>`;
  }
  if (r !== 'deals' || !params.get('keep')) scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
})();
</script>

name: probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: API 샘플 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m tools.probe
      - name: 인증키 노출 검사 후 커밋
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if grep -rqF "$DART_API_KEY" data/probe; then echo "DART key found in output" && exit 1; fi
          if [ -n "$DATA_GO_KR_KEY" ] && grep -rqF "$DATA_GO_KR_KEY" data/probe; then echo "data.go.kr key found" && exit 1; fi
          git config user.name "ecm-bot"
          git config user.email "ecm-bot@users.noreply.github.com"
          git add data/probe
          git commit -m "probe: API 샘플" || exit 0
          git pull --rebase -q
          git push

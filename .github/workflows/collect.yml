name: collect

on:
  schedule:
    # GitHub cron은 UTC 기준. KST = UTC+9
    - cron: "*/5 22-23 * * 0-4"   # 평일 KST 07:00~08:55 신규 공시 감시
    - cron: "*/5 0-10 * * 1-5"    # 평일 KST 09:00~19:55 신규 공시 감시
    - cron: "15 11 * * 1-5"       # 평일 KST 20:15 정기 갱신 (최근 7일 재수집 + 사모채)
  workflow_dispatch:
    inputs:
      mode:
        description: "watch / daily / backfill"
        default: "daily"
        type: choice
        options: [watch, daily, backfill]
      days:
        description: "daily·backfill 때 거슬러 올라갈 일수 (backfill은 최대 90 권장)"
        default: "7"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 실행 모드 결정
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "days=${{ inputs.days }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 11 * * 1-5" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"; echo "days=7" >> "$GITHUB_OUTPUT"
          else
            echo "mode=watch" >> "$GITHUB_OUTPUT"; echo "days=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m collector.run --mode ${{ steps.mode.outputs.mode }} --days ${{ steps.mode.outputs.days }}

      - name: 페이지 생성
        run: python -m web.build

      - name: 변경분 커밋
        id: commit
        run: |
          git config user.name "ecm-bot"
          git config user.email "ecm-bot@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: ${{ steps.mode.outputs.mode }} $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cloudflare Pages 배포
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 프로젝트가 없으면 처음 한 번 만든다 (이미 있으면 에러를 무시)
          preCommands: wrangler pages project create ${{ vars.CF_PAGES_PROJECT || 'ecm-board' }} --production-branch=main || true
          command: pages deploy public --project-name=${{ vars.CF_PAGES_PROJECT || 'ecm-board' }} --branch=main --commit-dirty=true

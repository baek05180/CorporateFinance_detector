name: proposal

# 사이트 팝업(/proposal) → Pages Function(/api/proposal) 이 workflow_dispatch 로 실행한다.
# 저장소가 공개라 실행 기록도 공개된다. 그래서 GitHub 로는 무작위 요청 ID 만 넘기고,
# 입력값·원본 템플릿·결과물은 모두 비공개 R2 버킷에서 읽고 쓴다. 로그에는 성공/실패만 남긴다.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "요청 ID (UUID)"
        required: true

permissions:
  contents: read

concurrency:
  group: proposal-${{ inputs.request_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQ_ID: ${{ inputs.request_id }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: s3://${{ vars.R2_BUCKET || 'ecm-proposals' }}
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WORK: /tmp/proposal
    steps:
      - name: 요청 ID 확인
        run: |
          if ! [[ "$REQ_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then echo "::error::bad request id"; exit 1; fi

      - name: 입력값 받기 (비공개 R2) · 상태 → 작성 중
        run: |
          mkdir -p "$WORK/out"
          aws s3 cp "$R2/proposals/$REQ_ID/input.json" "$WORK/input.json" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo '{"state":"running"}' > "$WORK/st.json"
          aws s3 cp "$WORK/st.json" "$R2/proposals/$REQ_ID/status.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --only-show-errors

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress poppler-utils fonts-noto-cjk >/dev/null
          pip install -q -r requirements.txt -r requirements-proposal.txt

      - name: 템플릿 받기 (비공개 R2)
        run: aws s3 cp "$R2/templates/proposal_template.pptx" "$WORK/template.pptx" --endpoint-url "$R2_ENDPOINT" --only-show-errors

      - name: 회사 데이터 생성
        run: python -m web.build > /dev/null

      - name: 제안서 생성
        continue-on-error: true
        run: python -m tools.proposal_job "$WORK/template.pptx" "$WORK/input.json" "$WORK/out"

      - name: 결과 올리기 (비공개 R2)
        if: always()
        run: |
          mkdir -p "$WORK/out"
          [ -f "$WORK/out/status.json" ] || echo '{"state":"error","error":"생성 단계 이전에 실패 (Actions 기록 확인)"}' > "$WORK/out/status.json"
          if [ -f "$WORK/out/proposal.pptx" ]; then
            aws s3 cp "$WORK/out/proposal.pptx" "$R2/proposals/$REQ_ID/proposal.pptx" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          fi
          aws s3 cp "$WORK/out/status.json" "$R2/proposals/$REQ_ID/status.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --only-show-errors
          rm -rf "$WORK"

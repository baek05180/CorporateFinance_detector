name: proposal

# 사이트 팝업(/proposal) → Pages Function(/api/proposal) 이 workflow_dispatch 로 실행한다.
# 원본 PPT 템플릿과 결과물은 공개 저장소에 올리지 않고 비공개 R2 버킷에만 둔다.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "요청 ID (UUID)"
        required: true
      payload:
        description: "팝업 입력값 JSON"
        required: true

permissions:
  contents: read

concurrency:
  group: proposal-${{ inputs.request_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQ_ID: ${{ inputs.request_id }}
      PAYLOAD: ${{ inputs.payload }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: s3://${{ vars.R2_BUCKET || 'ecm-proposals' }}
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: 요청 ID 확인
        run: |
          if ! [[ "$REQ_ID" =~ ^[0-9a-f-]{36}$ ]]; then echo "::error::bad request id"; exit 1; fi

      - name: 상태 → 작성 중
        run: |
          echo '{"state":"running"}' > /tmp/st.json
          aws s3 cp /tmp/st.json "$R2/proposals/$REQ_ID/status.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress poppler-utils fonts-noto-cjk >/dev/null
          pip install -q -r requirements.txt -r requirements-proposal.txt

      - name: 템플릿 내려받기 (비공개 R2)
        run: aws s3 cp "$R2/templates/proposal_template.pptx" /tmp/template.pptx --endpoint-url "$R2_ENDPOINT"

      - name: 회사 데이터 생성
        run: python -m web.build

      - name: 제안서 생성
        id: gen
        continue-on-error: true
        run: python -m tools.proposal_job /tmp/template.pptx out

      - name: 결과 올리기
        if: always()
        run: |
          mkdir -p out
          [ -f out/status.json ] || echo '{"state":"error","error":"생성 단계 이전에 실패 (Actions 기록 확인)"}' > out/status.json
          if [ -f out/proposal.pptx ]; then
            aws s3 cp out/proposal.pptx "$R2/proposals/$REQ_ID/proposal.pptx" --endpoint-url "$R2_ENDPOINT"
          fi
          aws s3 cp out/status.json "$R2/proposals/$REQ_ID/status.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json
